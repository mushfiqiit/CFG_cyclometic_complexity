name: Build

on:
  push:
  pull_request:

jobs:
  build:
    name: Build and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and run the tests
        run: ./gradlew build

      # These tests describe bugs that are not fixed yet, so they are expected to fail.
      # The step reports them without failing the workflow.
      - name: Run the known-bug tests
        if: matrix.os == 'ubuntu-latest'
        continue-on-error: true
        run: ./gradlew knownBugTest

      - name: Upload the test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.os }}
          path: build/reports/tests/
